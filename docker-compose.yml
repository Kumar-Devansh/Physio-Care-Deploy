services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: physiocare
      POSTGRES_USER: physiocare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physiocare -d physiocare"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - private_media:/srv/physiocare/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  reminders:
    build: .
    env_file: .env
    entrypoint: []
    command: ["python", "manage.py", "send_appointment_reminders", "--watch"]
    depends_on:
      db:
        condition: service_healthy
    # The worker exits successfully when email is disabled. Restart only when
    # it fails so local development does not produce a noisy restart loop.
    restart: on-failure

volumes:
  private_media:
  postgres_data:
