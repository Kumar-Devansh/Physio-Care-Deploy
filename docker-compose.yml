services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: physiocare
      POSTGRES_USER: physiocare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physiocare -d physiocare"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      # Use the PostgreSQL service defined above. This overrides any external
      # DATABASE_URL in .env when the project is started with Compose.
      DATABASE_URL: postgresql://physiocare:${POSTGRES_PASSWORD}@db:5432/physiocare?sslmode=disable
    volumes:
      - private_media:/srv/physiocare/media
      - staticfiles:/srv/physiocare/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/physiocare.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/srv/physiocare/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

  reminders:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://physiocare:${POSTGRES_PASSWORD}@db:5432/physiocare?sslmode=disable
    entrypoint: []
    command: ["python", "manage.py", "send_appointment_reminders", "--watch"]
    depends_on:
      db:
        condition: service_healthy
    # The worker exits successfully when email is disabled. Restart only when
    # it fails so local development does not produce a noisy restart loop.
    restart: on-failure

volumes:
  private_media:
  staticfiles:
  postgres_data:
